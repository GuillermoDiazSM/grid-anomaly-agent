[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-anomaly-agent"
version = "0.1.0"
description = "Ask questions about Spanish electricity data with an LLM agent: read-only SQL tools and robust anomaly detection over Red Eléctrica's public REData API."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Guillermo Díaz San Martín" }]
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grid-anomaly-agent = "grid_anomaly_agent.cli:main"

[tool.setuptools]
packages = ["grid_anomaly_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
